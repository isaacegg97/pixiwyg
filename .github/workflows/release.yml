# RULE: releases are automatic and follow the one app version (tools/package.json, set by npm run set-version):
#   a push to main whose version has no tag yet tests, builds, tags and publishes that version, then deploys the web
#   build to GitHub Pages. "Run workflow" here bumps first (prerelease 1.0.0-beta.1 -> beta.2, patch, minor, major,
#   or release, which drops the prerelease), commits the bump to main, and releases it. A push whose version is
#   already tagged stops after the plan job.
# RULE: each platform signs when its signing secrets are set and builds unsigned when they aren't; the release notes
#   say which builds are unsigned and how testers open them.
# FORMAT: what each platform ships:
#   Linux    .AppImage, .deb, .rpm   (the RPM's version is 1.0.0 with Release 0.beta.2; see tools/scripts/dist.mjs)
#   Windows  NSIS setup .exe, .msi   (the MSI's version is 1.0.0.2)
#   macOS    .dmg, one universal app for both chips
#   Web      PIXIWYG_<version>_web.zip: index.html, lib/, examples/ for any static host, and the same on GitHub Pages
# HACK: a release made with GITHUB_TOKEN can't trigger another workflow, so Pages deploys from here, not on the
#   release event (pages.yml stays for redeploying an older release by hand).
name: Release
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      bump:
        description: Bump the version first
        type: choice
        options: [none, prerelease, patch, minor, major, release]
        default: prerelease
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bump the version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          node tools/scripts/version.mjs "${{ inputs.bump }}"
          v="$(node -p "require('./tools/package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Version $v"
          git push origin HEAD:main
      - id: v
        run: |
          node tools/scripts/version.mjs
          v="$(node -p "require('./tools/package.json').version")"
          # FORMAT: releaseName in tools/package.json titles the release (beta 1.1 · RC 1); without it, the version.
          echo "name=$(node -p "require('./tools/package.json').releaseName||''")" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "tag=v$v" >> "$GITHUB_OUTPUT"; echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "::notice::v$v is already released; nothing to do."
          else echo "release=true" >> "$GITHUB_OUTPUT"; echo "::notice::Releasing v$v"; fi

  # RULE: the Playwright suite runs once, in the Playwright image, before any installer is built; each platform then
  #   launches its real app in smoke mode before packaging it (see ci.yml).
  test:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('tools/package-lock.json') }}
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm test

  build:
    needs: [plan, test]
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev rpm xvfb dbus-x11
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri
      - run: cargo test --locked
        working-directory: tauri
      - name: Launch the app (smoke)
        working-directory: tauri
        shell: bash
        env:
          PIXIWYG_SMOKE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          node ../tools/scripts/build.mjs
          if [ "$RUNNER_OS" = Linux ]; then PIXIWYG_USER_DATA="$RUNNER_TEMP/profile" dbus-run-session -- xvfb-run -a cargo run --locked
          else PIXIWYG_USER_DATA="$RUNNER_TEMP/profile" cargo run --locked; fi

      # RULE: macOS signs and notarizes only with the certificate and the Apple ID secrets together; Windows with its
      #   certificate. AppImages, .deb and .rpm are never signed.
      - name: Is signing available?
        id: sign
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 }}
        run: |
          case "$RUNNER_OS" in
            macOS)   if [ -n "$MAC_CERT" ] && [ -n "$APPLE_ID" ]; then s=true; else s=false; fi ;;
            Windows) if [ -n "$WIN_CERT" ]; then s=true; else s=false; fi ;;
            *)       s=false ;;
          esac
          echo "signed=$s" >> "$GITHUB_OUTPUT"
          if [ "$s" = false ] && [ "$RUNNER_OS" != Linux ]; then echo "::warning::No signing secrets for $RUNNER_OS, so this build is unsigned."; fi

      # FORMAT: the Windows certificate goes into the user's store; dist.mjs signs by its thumbprint.
      - name: Import the Windows certificate
        if: runner.os == 'Windows' && steps.sign.outputs.signed == 'true'
        shell: pwsh
        env:
          WIN_CERT: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_PASS: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WIN_CERT))
          $c = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WIN_PASS -AsPlainText -Force)
          Remove-Item $pfx
          "PIXIWYG_WIN_THUMBPRINT=$($c.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, signed (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.signed == 'true'
        run: npm run dist
        env:
          PIXIWYG_MAC_UNIVERSAL: '1'
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERT_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # HACK: unsigned macOS gets an ad-hoc signature, which Apple Silicon needs to run it at all
      - name: Build, unsigned (macOS)
        if: runner.os == 'macOS' && steps.sign.outputs.signed != 'true'
        run: npm run dist
        env:
          PIXIWYG_MAC_UNIVERSAL: '1'
          APPLE_SIGNING_IDENTITY: '-'
      - name: Build
        if: runner.os != 'macOS'
        run: npm run dist

      - name: Record whether this build is signed
        shell: bash
        run: echo "${{ steps.sign.outputs.signed }}" > "dist/signed-$RUNNER_OS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            tools/dist/*.dmg
            tools/dist/*.exe
            tools/dist/*.msi
            tools/dist/*.AppImage
            tools/dist/*.deb
            tools/dist/*.rpm
            tools/dist/signed-*.txt

  # RULE: the web zip is the same files the desktop app serves; the Pages job deploys exactly this zip.
  web:
    needs: [plan, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run web
      - name: Zip the web app
        run: cd dist/web && zip -qr "../PIXIWYG_${{ needs.plan.outputs.version }}_web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: tools/dist/*_web.zip

  publish:
    needs: [plan, build, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: tools/dist
          merge-multiple: true
      - run: node scripts/checksums.mjs
      - name: Release notes
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          NAME: ${{ needs.plan.outputs.name }}
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          signed() { [ "$(cat "dist/signed-$1.txt" 2>/dev/null)" = true ]; }
          {
            case "$TAG" in *-*) echo "Pre-release build of PIXIWYG $TAG${NAME:+ ($NAME)}. Check each download against SHA256SUMS.txt.";; *) echo "PIXIWYG $TAG${NAME:+ ($NAME)}. Check each download against SHA256SUMS.txt.";; esac
            echo
            echo "**Use it in a browser:** $PAGES"
            echo
            if signed macOS; then echo "**macOS:** signed and notarized."
            else echo "**macOS:** not signed or notarized. macOS blocks the first launch: open System Settings → Privacy & Security and click **Open Anyway** next to PIXIWYG. (Or, in Terminal: \`xattr -dr com.apple.quarantine /Applications/PIXIWYG.app\`.)"; fi
            echo
            if signed Windows; then echo "**Windows:** signed (the setup .exe and the .msi). SmartScreen may still warn until the certificate builds up reputation: click **More info**, then **Run anyway**."
            else echo "**Windows:** not signed. If the browser flags the download, choose **Keep**. When Windows says “Windows protected your PC”, click **More info**, then **Run anyway**. Windows 11 with Smart App Control turned on can't run unsigned apps; use a machine without it for this build. Use the setup .exe, or the .msi for managed installs; the app needs WebView2, which Windows 10 and 11 already have (the setup installs it if missing)."; fi
            echo
            echo "**Linux:** the AppImage, .deb and .rpm aren't signed. AppImage: make it executable (\`chmod +x\`), then run it. Debian/Ubuntu: \`sudo apt install ./PIXIWYG_*.deb\`. Fedora: \`sudo dnf install ./PIXIWYG-*.rpm\`."
            echo
            echo "**Web:** unzip \`PIXIWYG_*_web.zip\` onto any static web server, at any path; nothing else is needed."
          } > notes.md
          cat notes.md
      - name: Tag and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          NAME: ${{ needs.plan.outputs.name }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.msi dist/*.AppImage dist/*.deb dist/*.rpm dist/*_web.zip dist/SHA256SUMS.txt)
          pre=(); case "$TAG" in *-*) pre=(--prerelease);; esac
          gh release create "$TAG" --target "$SHA" "${pre[@]}" --title "PIXIWYG ${NAME:-$TAG}" --notes-file notes.md --generate-notes "${files[@]}"

  pages:
    needs: [plan, web, publish]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-web
      - run: mkdir site && unzip -q ./*_web.zip -d site && test -f site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
