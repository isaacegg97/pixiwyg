<!-- SECTION: Animate timeline -->
<section class="timeline" id="timeline" hidden aria-label="Animation timeline">
  <div class="tltop"><button class="btn" id="tlStart" title="Back to the start">⏮</button><button class="btn primary" id="tlPlay" aria-pressed="false">▶ Play</button><span class="tltime" id="tlTime">0.00 s</span>
    <button class="btn" id="tlAnimate" title="Give the selected element an animation, or edit its one">Animate the selection…</button>
    <label class="sqopt" title="Zoom the timeline">Zoom <input type="range" id="tlZoom" min="60" max="480" value="160"></label>
    <span class="shelp" title="Drag a bar to change when it starts, its right edge to change how long. Drag along the ruler to scrub. Every animation plays from 0 here, whatever starts it on the page.">Drag a bar to change when it starts, its right edge to change how long. Drag along the ruler to scrub. Every animation plays from 0 here, whatever starts it on the page.</span></div>
  <div class="tlscroll"><div class="tlruler" id="tlRuler"></div><div class="tlrows" id="tlRows"></div><i class="tlplayhead" id="tlHead"></i>
    <p class="tlempty" id="tlEmpty">Nothing moves yet. Select something on the page and Animate the selection.</p></div>
</section>
