<!-- SECTION: versions dialog -->
<div class="modal" id="verModal" hidden>
  <div class="win verwin" role="dialog" aria-modal="true" aria-labelledby="verTitle">
    <div class="tb"><span id="verTitle">Versions</span><button class="wclose" id="verClose" aria-label="Close" title="Close (Esc)">×</button></div>
    <div class="wb">
      <p>A version is this whole project as it is now, kept in this browser. Going back to one keeps what you had as a version too.</p>
      <div class="row"><input id="verName" type="text" maxlength="80" placeholder="Name it (optional)" aria-label="Version name"><button class="btn primary" id="verSave">Save version</button></div>
      <ol class="verlist" id="verList"></ol>
    </div>
  </div>
</div>
