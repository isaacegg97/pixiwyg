<!-- SECTION: Brushes palette (cards are built by brush-library.js) -->
      <section class="spal" data-pal="brushes" data-title="Brushes">
        <div class="brgrid" id="brGrid" role="listbox" aria-label="Brushes"></div>
        <div class="lybar">
          <button class="btn sqm" id="brNew" type="button" title="A new brush, starting from this one, opened in the brush editor">＋ New</button>
          <button class="btn sqm" id="brEdit" type="button" title="Change this brush: its tip, its style, how it lays down (a built-in one is copied first)">Edit…</button>
          <button class="btn sqm" id="brDup" type="button" title="Copy this brush">Duplicate</button>
          <button class="btn sqm" id="brDel" type="button" title="Delete this brush (built-in brushes stay)" aria-label="Delete brush">✕</button>
        </div>
      </section>
