<!-- SECTION: text effects drilldown -->
<div class="modal" id="tfxModal" hidden>
  <div class="win m3dwin" role="dialog" aria-modal="true" aria-labelledby="tfxTitle">
    <div class="tb"><span id="tfxTitle">Text effects</span><button class="wclose" id="tfxClose" aria-label="Close" title="Close (Esc)">×</button></div>
    <div class="fxbody">
      <div class="fxlist" id="tfxList"></div>
      <div class="fxopts">
        <p class="shelp">Select words or letters below, pick an effect, Apply. Effects stay in the page with no script; moving ones rest for visitors who ask for less motion.</p>
        <div class="tfxtext" id="tfxText" aria-label="The element's text: select part of it"></div>
        <div id="tfxParams"></div>
        <div class="row"><button class="btn primary" id="tfxApply" type="button">Apply to selection</button><button class="btn" id="tfxDone" type="button">Done</button></div>
        <h4>In this element</h4><div id="tfxUsed" class="refslist"></div>
      </div>
    </div>
  </div>
</div>
