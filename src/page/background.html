<!-- SECTION: Properties: Page background -->
  <details class="sect" id="w-bg" open><summary class="ph">Page background</summary><div class="wb bgwb" id="bgwb">
    <div class="blrow"><span class="blcol">Base color <span id="bgBaseCtl"></span></span></div>
    <div class="bglayers" id="bgLayers"></div>
    <div class="row">
      <select id="bgAdd" aria-label="Add a background layer"><option value="">Add layer…</option><option value="image">Image</option><option value="linear">Linear gradient</option><option value="radial">Radial gradient</option><option value="pattern">Pattern</option></select>
      <button class="btn" id="bgSavePrim">Save as primitive</button>
      <button class="btn" id="bgClear">Clear</button>
    </div>
    <small class="credit">Layers stack top to bottom over the base color. Colors set to a palette role follow the page palette.</small>
  </div></details>
