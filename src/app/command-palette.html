<!-- SECTION: command palette -->
<div class="modal" id="cmdModal" hidden>
  <div class="win cmdwin" role="dialog" aria-modal="true" aria-labelledby="cmdTitle">
    <div class="tb"><span id="cmdTitle">Commands &amp; Tools</span><button class="wclose" id="cmdClose" aria-label="Close" title="Close (Esc)">×</button></div>
    <div class="wb cmdbody">
      <input class="cmdinput" id="cmdSearch" type="search" placeholder="Type a command or tool... (↑/↓ to navigate, Enter to run, Esc to close)" aria-label="Search commands" autocomplete="off">
      <div class="cmdlist" id="cmdList" role="listbox" aria-label="Commands"></div>
    </div>
  </div>
</div>
