<!-- SECTION: guided tour -->
<div class="tour" id="tour" hidden>
  <svg class="tourdim" id="tourDim" aria-hidden="true"><path fill-rule="evenodd"></path></svg>
  <div id="tourSpots"></div>
  <section class="win tourcard" id="tourCard" role="dialog" aria-labelledby="tourTitle" aria-describedby="tourBody">
    <div class="tb"><span id="tourStep">Tour</span><button class="wclose" id="tourClose" aria-label="Leave the tour" title="Leave the tour (Esc)">×</button></div>
    <div class="wb">
      <h2 id="tourTitle"></h2>
      <p id="tourBody"></p>
      <dl class="tourkeys" id="tourKeys"></dl>
      <div class="row"><button class="btn" id="tourBack">Back</button><button class="btn primary" id="tourNext">Next</button></div>
    </div>
  </section>
</div>
